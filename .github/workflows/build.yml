name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: XPlane12-FlightLessons-zh-CN-win-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: XPlane12-FlightLessons-zh-CN-linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: 冒烟测试（核心逻辑 + GUI headless）
        run: dotnet run --project tests/SmokeTests/SmokeTests.csproj -c Release

      - name: 发布（自包含）
        run: >
          dotnet publish src/XpLessonZhCN.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=false
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist/${{ matrix.rid }}

      - name: 发布单文件版（仅 Windows）
        if: runner.os == 'Windows'
        run: >
          dotnet publish src/XpLessonZhCN.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist/win-x64-single

      - name: 复制单文件产物（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/win-x64-single/XPlane12-FlightLessons-zh-CN.exe "dist/${{ matrix.artifact }}-single.exe"

      - name: 校验发布产物能启动（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/${{ matrix.rid }}/XPlane12-FlightLessons-zh-CN.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput selftest.log
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { Write-Error "发布产物自检失败"; exit 1 }

      - name: 校验发布产物能启动（Linux）
        if: runner.os == 'Linux'
        run: |
          exe="dist/${{ matrix.rid }}/XPlane12-FlightLessons-zh-CN"
          chmod +x "$exe"
          "$exe" --selftest

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item docs/使用说明.md dist/${{ matrix.rid }}/使用说明.md
          Compress-Archive -Path "dist/${{ matrix.rid }}/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: 打包（Linux）
        if: runner.os == 'Linux'
        run: |
          cd dist/${{ matrix.rid }}
          chmod +x XPlane12-FlightLessons-zh-CN
          cp ../../docs/使用说明.md 使用说明.md
          tar czf "../${{ matrix.artifact }}.tar.gz" *

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd dist
          : > SHA256SUMS-${{ matrix.rid }}.txt
          for f in *.zip *.tar.gz *.exe; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null; then sha256sum "$f" >> SHA256SUMS-${{ matrix.rid }}.txt; else shasum -a 256 "$f" >> SHA256SUMS-${{ matrix.rid }}.txt; fi
          done
          cat SHA256SUMS-${{ matrix.rid }}.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}-single.exe
            dist/SHA256SUMS-${{ matrix.rid }}.txt

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}-single.exe
            dist/SHA256SUMS-${{ matrix.rid }}.txt
