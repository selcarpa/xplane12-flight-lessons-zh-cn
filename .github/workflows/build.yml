name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 默认只读；发布 Release 的 job 单独申请 contents: write
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          # Windows on ARM（骁龙 X 等 ARM64 PC）。arm64 runner 只对公共仓库免费可用
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          # Linux ARM64（ARMv8-A / arm64-v8a）。arm64 runner 只对公共仓库免费可用
          - os: ubuntu-24.04-arm
            rid: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: 计算版本号（打 tag 时用 tag，否则用占位版本）
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then v="0.0.0-ci"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "构建版本号：$v"

      - name: 冒烟测试（核心逻辑 + GUI headless）
        run: dotnet run --project tests/SmokeTests/SmokeTests.csproj -c Release

      # 构建 + 发布 + 打包 + 生成 SHA256SUMS 全部交给 scripts/ 下的脚本，
      # publish 参数与产物文件名规则只在 scripts/lib/build-common.props 里定义一次，
      # workflow 不再内联复制（版本号由上面的步骤算出后透传给脚本）。
      - name: 构建并打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build.ps1 -SkipTests -Rid '${{ matrix.rid }}' -Version '${{ env.APP_VERSION }}'

      - name: 构建并打包（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./scripts/build.sh --skip-tests --rid '${{ matrix.rid }}' --version '${{ env.APP_VERSION }}'

      # 说明：下面这一步是对「publish 之后的单文件产物」再跑一次 --selftest，
      # 与上面冒烟测试里的 Selftest.Run() 语义不同（前者验证发布产物能独立启动），
      # 因此不能当成重复步骤删掉。
      - name: 校验发布产物能启动（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/${{ matrix.rid }}/XPlane12-FlightLessons-zh-CN.exe"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput selftest.log
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { Write-Error "发布产物自检失败"; exit 1 }

      - name: 校验发布产物能启动（Linux）
        if: runner.os == 'Linux'
        run: |
          exe="dist/${{ matrix.rid }}/XPlane12-FlightLessons-zh-CN"
          chmod +x "$exe"
          "$exe" --selftest

      # 打包与 SHA256SUMS 已在上面的「构建并打包」步骤里由脚本完成：
      #   Windows → dist/XPlane12-FlightLessons-zh-CN-<rid>.zip + dist/SHA256SUMS-<rid>.txt
      #   Linux   → dist/XPlane12-FlightLessons-zh-CN-<rid>.tar.gz + dist/SHA256SUMS-<rid>.txt
      # 文件名规则来自 scripts/lib/build-common.props（APP_BASENAME-<rid>）。
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: XPlane12-FlightLessons-zh-CN-${{ matrix.rid }}
          path: |
            dist/XPlane12-FlightLessons-zh-CN-${{ matrix.rid }}.zip
            dist/XPlane12-FlightLessons-zh-CN-${{ matrix.rid }}.tar.gz
            dist/SHA256SUMS-${{ matrix.rid }}.txt

  # 单独一个 job 汇总四个平台后再发布，避免多个矩阵 job 并发创建同一个 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 下载全部平台的产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 合并校验和
        shell: bash
        run: |
          cd artifacts
          ls -l
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: 生成 Release 说明（含兼容版本列表）
        shell: bash
        run: |
          cat docs/release/release-notes.md > release-notes.md
          echo >> release-notes.md
          python3 scripts/tools/render-compat-versions.py >> release-notes.md
          echo '--- release-notes.md ---'
          cat release-notes.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: X-Plane 12 飞行教学汉化 ${{ github.ref_name }}
          # tag 名里带 - 的（如 v0.1.0-snapshot）自动标为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 正文 = docs/release/release-notes.md + 由 compat/known-versions.json 自动生成的「兼容版本」表
          body_path: release-notes.md
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz

            artifacts/SHA256SUMS.txt
